# Run API snapshot checker on pushes and pull requests
# Place this file at .github/workflows/pychrono-api-check.yml
name: PyChrono API snapshot check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-api-snapshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install deps (requests optional)
      run: |
        python -m pip install --upgrade pip
        pip install requests || true
    - name: Run pychrono API checker
      run: |
        # snapshot dir should be in repo at pychrono_api_repo/
        python check_pychrono_api.py --snapdir pychrono_api_repo --paths src .
